# GitHub Actions Workflow: Auto-build Android APK for CliniX
#
# Configure the following 7 repository secrets in GitHub Settings -> Secrets and variables -> Actions:
# 1. GOOGLE_SERVICES_JSON_B64   : Base64 encoded android/app/google-services.json
# 2. FIREBASE_OPTIONS_DART_B64  : Base64 encoded lib/firebase_options.dart
# 3. ENV_RELEASE_B64            : Base64 encoded production .env
# 4. ANDROID_KEYSTORE_B64       : Base64 encoded release keystore (clinix-release-key.jks)
# 5. KEYSTORE_PASSWORD          : Keystore password string
# 6. KEY_PASSWORD               : Key alias password string
# 7. KEY_ALIAS                  : Key alias string

name: Build Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clinix

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Private Release Configuration & Credentials
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          ENV_RELEASE_B64: ${{ secrets.ENV_RELEASE_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart
          echo "$ENV_RELEASE_B64" | base64 -d > .env
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/clinix-release-key.jks

          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=clinix-release-key.jks
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Obfuscated Release APKs
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Prepare Release Artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk CliniX.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: clinix/CliniX.apk
          generate_release_notes: true
